name: Build Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - nsis
          - appx

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Read version
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + prepare icons
        run: |
          npm run build
          npm run icon:prepare

      - name: Build NSIS installer (.exe)
        id: build-nsis
        if: ${{ github.event_name == 'push' || inputs.target == 'nsis' || inputs.target == 'both' }}
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build AppX / MSIX (Microsoft Store)
        id: build-appx
        if: ${{ github.event_name == 'push' || inputs.target == 'appx' || inputs.target == 'both' }}
        run: npx electron-builder --win appx --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload NSIS artifact
        if: ${{ always() && steps.build-nsis.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: KobiChat-${{ env.APP_VERSION }}-Setup-exe
          path: release-build/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AppX artifact
        if: ${{ always() && steps.build-appx.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: KobiChat-${{ env.APP_VERSION }}-Store-appx
          path: release-build/*.appx
          if-no-files-found: warn
          retention-days: 30
