name: Build Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - nsis
          - appx

# Release oluşturup dosya yükleyebilmek için gerekli.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Read version
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + prepare icons
        run: |
          npm run build
          npm run icon:prepare

      - name: Build NSIS installer (.exe)
        id: build-nsis
        if: ${{ github.event_name == 'push' || inputs.target == 'nsis' || inputs.target == 'both' }}
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build AppX / MSIX (Microsoft Store)
        id: build-appx
        if: ${{ github.event_name == 'push' || inputs.target == 'appx' || inputs.target == 'both' }}
        run: npx electron-builder --win appx --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # GitHub Releases'e yükle. Artifact kotasına TAKILMAZ (artifact'ler
      # her build'de birikip 500MB ücretsiz sınırı dolduruyordu). Aynı sürüm
      # tag'i varsa günceller; latest.yml + blockmap electron-updater içindir.
      - name: Publish to GitHub Release
        if: ${{ always() && (steps.build-nsis.conclusion == 'success' || steps.build-appx.conclusion == 'success') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: KobiChat ${{ env.APP_VERSION }}
          fail_on_unmatched_files: false
          files: |
            release-build/*.exe
            release-build/*.exe.blockmap
            release-build/latest*.yml
            release-build/*.appx
